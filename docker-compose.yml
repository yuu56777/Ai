version: '3.8'

services:
  cybersecurity-app:
    build: .
    container_name: cybersecurity-fraud-detection
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./fraud_detection.db
      - SECRET_KEY=your-super-secret-key-change-this-in-production
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      # Optional: Add your API keys here
      # - VIRUSTOTAL_API_KEY=your_api_key_here
      # - HYBRID_ANALYSIS_API_KEY=your_api_key_here
    volumes:
      - ./uploads:/app/uploads
      - ./models:/app/models
      - ./fraud_detection.db:/app/fraud_detection.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add a reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: cybersecurity-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl  # Add your SSL certificates here
    depends_on:
      - cybersecurity-app
    restart: unless-stopped
    profiles:
      - production