<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cybersecurity File Analyzer</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 2rem;
      }
      #output {
        white-space: pre-wrap;
        background: #f5f5f5;
        padding: 1rem;
        border-radius: 4px;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>AI Cybersecurity Fraud Detection – File Upload</h1>
    <input type="file" id="fileInput" />
    <button onclick="upload()">Upload & Scan</button>

    <div id="spinner" style="display:none; margin-top:1rem;">🔄 Scanning...</div>
    <div id="reportContainer"></div>

    <footer style="margin-top:2rem; font-size:0.9rem; color:#555;">
      By uploading a file you agree to the
      <a href="/privacy" target="_blank">privacy policy</a>.
    </footer>

    <script>
      function upload() {
        const input = document.getElementById("fileInput");
        if (!input.files.length) {
          alert("Please choose a file first.");
          return;
        }
        const file = input.files[0];
        const body = new FormData();
        body.append("file", file);

        document.getElementById("spinner").style.display = "block";
        document.getElementById("reportContainer").innerHTML = "";

        fetch("/upload", { method: "POST", body })
          .then((r) => r.json())
          .then((data) => {
            show(data);
            if (data.job_id) poll(data.job_id);
          })
          .catch((err) => {
            show({ error: err.toString() });
          });
      }

      function poll(jobId) {
        const timer = setInterval(() => {
          fetch(`/report/${jobId}`)
            .then((r) => r.json())
            .then((data) => {
              show(data);
              if (data.status && data.status !== "processing") {
                clearInterval(timer);
                document.getElementById("spinner").style.display = "none";

                fetch(`/report/${jobId}/html`)
                  .then((r) => r.text())
                  .then((html) => {
                    displayReport(jobId, html);
                  });
              }
            })
            .catch(() => clearInterval(timer));
        }, 2000);
      }

      function show(obj) {
        // fallback text output (debug)
        console.log(obj);
      }

      function displayReport(jobId, html) {
        const container = document.getElementById("reportContainer");
        container.innerHTML = html;

        // Add feedback section
        const fbDiv = document.createElement("div");
        fbDiv.style.marginTop = "1rem";
        fbDiv.innerHTML = `
          <h3>Was this analysis correct?</h3>
          <button id="fb_correct">Correct</button>
          <button id="fb_fp">False Positive</button>
          <button id="fb_fn">False Negative</button>
          <span id="fb_msg" style="margin-left:1rem; color:green;"></span>
        `;
        container.appendChild(fbDiv);

        const send = (verdict) => {
          fetch("/feedback", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ job_id: jobId, user_verdict: verdict }),
          })
            .then(() => {
              document.getElementById("fb_msg").textContent = "Thank you!";
            })
            .catch(() => {
              document.getElementById("fb_msg").textContent = "Error submitting feedback";
            });
        };

        document.getElementById("fb_correct").onclick = () => send("correct");
        document.getElementById("fb_fp").onclick = () => send("false_positive");
        document.getElementById("fb_fn").onclick = () => send("false_negative");
      }
    </script>
  </body>
</html>
